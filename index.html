<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta name="theme-color" content="#111111"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<link rel="icon" href="icon-192.png"/>
<link rel="apple-touch-icon" href="icon-192.png"/>
<link rel="manifest" href="manifest.webmanifest"/>
<title>Actividades infantiles — Madrid</title>
<script src="engine.js"></script>
<script src="api-shim.js"></script>
<script>
// Apply saved theme ASAP to avoid a flash of the wrong palette.
(function(){
  try{ var t=localStorage.getItem("mk_colorTheme");
    if(t) document.documentElement.setAttribute("data-apptheme", t);
    else document.documentElement.setAttribute("data-apptheme","magazine");
  }catch(e){ document.documentElement.setAttribute("data-apptheme","magazine"); }
})();
</script>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}

  /* ===== THEME VARIABLES (set on <html> via data-apptheme) ===== */
  :root{
    --accent:#111; --accent-ink:#fff; --accent-soft:#f2f2f3; --accent-soft-ink:#333;
    --bg:#fff; --ink:#17171a; --muted:#999; --card:#fff; --line:#ececf0;
    --hero1:#f857a6; --hero2:#ff5858;
  }
  :root[data-apptheme="magazine"]{ --accent:#111; --accent-ink:#fff; --accent-soft:#f2f2f3; --accent-soft-ink:#333 }
  :root[data-apptheme="grape"]{ --accent:#7b2d8e; --hero1:#9b3fb0; --hero2:#7b2d8e; --accent-soft:#f3e8f7; --accent-soft-ink:#7b2d8e }
  :root[data-apptheme="ocean"]{ --accent:#0e7490; --hero1:#06b6d4; --hero2:#2563eb; --accent-soft:#e0f2fe; --accent-soft-ink:#0369a1 }
  :root[data-apptheme="sunset"]{ --accent:#e11d48; --hero1:#fb7185; --hero2:#f97316; --accent-soft:#ffe4e6; --accent-soft-ink:#be123c }
  :root[data-apptheme="forest"]{ --accent:#047857; --hero1:#34d399; --hero2:#059669; --accent-soft:#dcfce7; --accent-soft-ink:#047857 }
  :root[data-apptheme="candy"]{ --accent:#db2777; --hero1:#f472b6; --hero2:#a855f7; --accent-soft:#fce7f3; --accent-soft-ink:#be185d }
  :root[data-apptheme="dark"]{
    --accent:#7c5cff; --accent-ink:#fff; --accent-soft:#1b2030; --accent-soft-ink:#c4b5fd;
    --bg:#0f1118; --ink:#e8eaf2; --muted:#8890a8; --card:#171a27; --line:#262a3d;
    --hero1:#7c5cff; --hero2:#4fd1c5 }

  body{background:var(--bg);color:var(--ink)}
  #app{position:fixed;inset:0;overflow:hidden}

  .view{position:absolute;inset:0 0 64px 0;overflow-y:auto;overflow-x:hidden;display:none;
    padding-top:env(safe-area-inset-top)}
  .view.on{display:block}
  .view::-webkit-scrollbar{width:0}

  .top{padding:18px 18px 6px}
  .top h3{font-size:24px;font-weight:900;letter-spacing:-.7px;line-height:1.06;margin:0}
  .top .sub{font-size:12px;color:var(--muted);margin-top:6px}
  .secttl{font-size:19px;font-weight:900;padding:18px 18px 2px}

  .pills{display:flex;gap:7px;overflow-x:auto;padding:10px 18px}
  .pills::-webkit-scrollbar{height:0}
  .pill{flex:none;font-size:12px;font-weight:700;padding:7px 14px;border-radius:30px;background:var(--accent-soft);color:var(--accent-soft-ink);border:0;font-family:inherit;cursor:pointer}
  .pill.on{background:var(--accent);color:var(--accent-ink)}

  .feed{padding:4px 18px 24px;display:flex;flex-direction:column;gap:20px}
  .tile{border-radius:20px;overflow:hidden;box-shadow:0 8px 24px rgba(0,0,0,.12);background:var(--card)}
  .hero{height:116px;position:relative;display:flex;align-items:flex-end;padding:12px;color:#fff;
    background:linear-gradient(135deg,var(--hero1),var(--hero2))}
  :root[data-apptheme="magazine"] .hero.hc1{background:linear-gradient(135deg,#f857a6,#ff5858)}
  :root[data-apptheme="magazine"] .hero.hc2{background:linear-gradient(135deg,#4e65ff,#92effd)}
  :root[data-apptheme="magazine"] .hero.hc3{background:linear-gradient(135deg,#f6d365,#fda085)}
  :root[data-apptheme="magazine"] .hero.hc4{background:linear-gradient(135deg,#30cfd0,#330867)}
  :root[data-apptheme="magazine"] .hero.hc5{background:linear-gradient(135deg,#a18cd1,#fbc2eb)}
  .hero .cat{position:absolute;top:12px;left:12px;z-index:2;font-size:10px;font-weight:900;text-transform:uppercase;
    letter-spacing:.5px;background:rgba(0,0,0,.35);padding:4px 10px;border-radius:20px}
  .hero .photo{position:absolute;inset:0;background-size:cover;background-position:center;opacity:0;transition:opacity .4s}
  .hero.hasphoto .photo{opacity:1}
  .hero.hasphoto .emoji{display:none}
  .hero.hasphoto h4{position:relative;z-index:2}
  .hero.hasphoto:after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.55),transparent 55%);z-index:1}
  .hero .dsrc{display:none;position:absolute;bottom:9px;right:10px;z-index:2;font-size:8.5px;font-weight:700;
    color:rgba(255,255,255,.85);background:rgba(0,0,0,.45);padding:2px 7px;border-radius:9px}
  .hero.hasphoto .dsrc{display:block}
  .hero .emoji{font-size:48px;position:absolute;right:14px;top:50%;transform:translateY(-50%);opacity:.92}
  .hero h4{margin:0;font-size:18px;font-weight:900;line-height:1.1;text-shadow:0 1px 6px rgba(0,0,0,.45);z-index:2;max-width:66%}
  .tilefav{position:absolute;top:10px;right:10px;z-index:3;background:rgba(0,0,0,.35);border:0;
    color:#fff;font-size:18px;width:34px;height:34px;border-radius:50%;cursor:pointer;line-height:1}
  .tilefav.on{color:#ffd84d}
  .cardbody{padding:13px 14px}
  .cardbody .m{font-size:12px;color:var(--muted);margin:0 0 9px}
  .cardbody .r{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:11px}
  .cardbody .tnote{font-size:10px;line-height:1.35;color:var(--muted);font-style:italic;margin:-4px 0 11px}
  .cardbody .t{font-size:10px;font-weight:800;padding:3px 8px;border-radius:6px;background:var(--accent-soft);color:var(--accent-soft-ink)}
  .cardbody .t.free{background:#eafaf0;color:#167a43}
  .cardbody .btns{display:flex;gap:7px}
  .cardbody .btns a{flex:1;text-align:center;font-size:12px;font-weight:800;padding:10px;border-radius:10px;text-decoration:none;cursor:pointer}
  .cardbody .btns a.p{background:var(--accent);color:var(--accent-ink)}
  .cardbody .btns a.g{background:var(--accent-soft);color:var(--accent-soft-ink)}

  /* MAP (real Leaflet) */
  #map{position:absolute;inset:0;background:#e8eef0}
  .nearbtn{position:absolute;right:14px;top:calc(14px + env(safe-area-inset-top));z-index:500;
    background:var(--accent);color:var(--accent-ink);border:0;border-radius:24px;padding:10px 15px;
    font-size:13px;font-weight:800;box-shadow:0 6px 16px rgba(0,0,0,.3);cursor:pointer;font-family:inherit}
  .nearbtn.on{outline:3px solid color-mix(in srgb,var(--accent) 30%,transparent)}
  .maploading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    color:var(--muted);font-size:14px;font-weight:600;background:var(--accent-soft)}
  .mapcard{position:absolute;left:12px;right:12px;bottom:12px;z-index:500;background:var(--card);border-radius:16px;
    box-shadow:0 10px 30px rgba(0,0,0,.22);padding:13px 14px}
  .mapcard .head{display:flex;gap:11px;align-items:flex-start}
  .mapcard .em{font-size:30px;line-height:1}
  .mapcard .mc{flex:1;min-width:0}
  .mapcard h4{margin:0 0 3px;font-size:14px;line-height:1.2}
  .mapcard .mm{font-size:11px;color:var(--muted)}
  .mapcard .fav{background:none;border:0;font-size:20px;color:#d9b400;cursor:pointer;line-height:1;padding:0 2px}
  .mapcard .fav.on{color:#f5b800}
  .mapcard .close{background:none;border:0;font-size:18px;color:var(--muted);cursor:pointer;line-height:1;padding:0 2px}
  .mapcard .r{display:flex;gap:5px;flex-wrap:wrap;margin:9px 0 10px}
  .mapcard .t{font-size:10px;font-weight:800;padding:3px 8px;border-radius:6px;background:var(--accent-soft);color:var(--accent-soft-ink)}
  .mapcard .t.free{background:#eafaf0;color:#167a43}
  .mapcard .btns{display:flex;gap:6px;flex-wrap:wrap}
  .mapcard .btns a{flex:1;min-width:0;text-align:center;font-size:11.5px;font-weight:800;padding:9px 6px;border-radius:9px;text-decoration:none;white-space:nowrap;cursor:pointer}
  .mapcard .btns a.p{flex-basis:100%;background:var(--accent);color:var(--accent-ink)}
  .mapcard .btns a.g{background:var(--accent-soft);color:var(--accent-soft-ink)}

  /* Leaflet chrome -> follow the app theme (no stray white boxes).
     Leaflet's CSS is injected at runtime AFTER this <style>, so we raise
     specificity with #map and use !important to win the cascade. */
  #map .leaflet-popup-content-wrapper,
  #map .leaflet-tooltip{
    background:var(--card)!important;color:var(--ink)!important;
    border:1px solid var(--line)!important;border-radius:12px!important;box-shadow:0 8px 24px rgba(0,0,0,.22)!important}
  #map .leaflet-popup-content{font-size:12.5px;line-height:1.4;color:var(--ink)!important}
  #map .leaflet-popup-tip{background:var(--card)!important;box-shadow:none!important}
  #map .leaflet-tooltip{padding:4px 8px;font-size:11px;font-weight:700}
  #map .leaflet-tooltip-top:before{border-top-color:var(--card)!important}
  #map .leaflet-tooltip-bottom:before{border-bottom-color:var(--card)!important}
  #map .leaflet-tooltip-left:before{border-left-color:var(--card)!important}
  #map .leaflet-tooltip-right:before{border-right-color:var(--card)!important}
  #map .leaflet-popup-close-button{color:var(--muted)!important}
  #map .leaflet-control-attribution{
    background:color-mix(in srgb,var(--card) 88%,transparent)!important;color:var(--muted)!important;
    border-radius:8px 0 0 0}
  #map .leaflet-control-attribution a{color:var(--accent-soft-ink)!important}
  #map .leaflet-bar a,
  #map .leaflet-bar a:link,
  #map .leaflet-bar a:visited{background:var(--card)!important;color:var(--ink)!important;border-bottom-color:var(--line)!important}
  #map .leaflet-bar a:hover{background:var(--accent-soft)!important}

  /* SEARCH */
  .search{padding:8px 18px 24px}
  .cats{display:flex;flex-wrap:wrap;gap:7px;margin-top:4px}
  .cat{display:inline-flex;align-items:center;gap:5px;background:var(--accent-soft);color:var(--accent-soft-ink);
    border:1.5px solid transparent;border-radius:20px;padding:7px 13px;font-size:13px;font-weight:600;
    cursor:pointer;font-family:inherit;line-height:1.2}
  .cat.on{background:var(--accent);color:var(--accent-ink)}
  .clearbtn{width:100%;background:transparent;color:var(--muted);border:1.5px solid var(--line);
    font-size:13px;font-weight:700;padding:11px;border-radius:11px;font-family:inherit;cursor:pointer;margin-top:10px}
  .chk{display:flex;align-items:center;gap:10px;margin:12px 0;font-size:14px;font-weight:600;color:var(--ink);cursor:pointer}
  .chk input{width:20px;height:20px;accent-color:var(--accent);margin:0;flex:none}
  .fld{margin:12px 0}
  .fld label{display:block;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);margin-bottom:5px}
  .fld input,.fld select{width:100%;padding:11px 12px;border:1.5px solid var(--line);border-radius:11px;font-size:16px;font-family:inherit;background:var(--card);color:var(--ink)}
  .go{width:100%;border:0;background:var(--accent);color:var(--accent-ink);font-weight:800;font-size:15px;padding:14px;border-radius:12px;margin-top:6px;cursor:pointer;font-family:inherit}

  /* SETTINGS */
  .settings{padding:8px 18px 24px}
  .settings .lbl{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);margin:18px 0 10px}
  .swatches{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
  .sw{border:2px solid var(--line);border-radius:14px;padding:12px 10px;cursor:pointer;background:var(--card);text-align:center;font-family:inherit}
  .sw.on{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 25%,transparent)}
  .sw .dot{width:40px;height:40px;border-radius:50%;margin:0 auto 8px}
  .sw .nm{font-size:11px;font-weight:800;color:var(--ink)}

  .empty{padding:70px 24px;text-align:center;color:var(--muted)}
  .empty .big{font-size:46px;margin-bottom:10px}

  /* ===== Home full-screen swipeable card deck ===== */
  /* ===== Home full-screen swipeable card deck (fixed dark palette from design-cards-real) ===== */
  #v-home.deckmode{display:none;flex-direction:column;padding:0;background:#0f1118}
  #v-home.deckmode.on{display:flex}
  #v-home.deckmode .top{flex:none}
  #v-home.deckmode .top h3{color:#e8eaf2}
  #v-home.deckmode .top .sub{color:#9aa0b5}
  #v-home.deckmode .pills{flex:none}
  #v-home.deckmode .bar{flex:none}
  #v-home.deckmode .statusmsg{flex:none;color:#9aa0b5}
  #v-home.deckmode #v-home-feed{flex:1;min-height:0;display:flex;flex-direction:column}
  /* counter top-right next to the title, like the prototype */
  #v-home.deckmode .top{display:flex;align-items:center;justify-content:space-between}
  .dcount{flex:none;font-size:12px;font-weight:800;color:#9aa0b5;background:#171a27;border:1px solid #262a3d;padding:6px 12px;border-radius:20px}
  .dcount b{color:#fff}
  /* quick-filter chips: dark style over the night background */
  #v-home.deckmode .pill{background:#171a27;color:#c7cbe0;border:1px solid #262a3d}
  #v-home.deckmode .pill.on{background:#7b2d8e;color:#fff;border-color:#7b2d8e}

  /* Favorites reuses the Home full-screen card deck */
  #v-fav.deckmode{display:none;flex-direction:column;padding:0;background:#0f1118}
  #v-fav.deckmode.on{display:flex}
  #v-fav.deckmode .secttl{flex:none;color:#e8eaf2;display:flex;align-items:center;justify-content:space-between}
  #v-fav.deckmode #v-fav-feed{flex:1;min-height:0;display:flex;flex-direction:column}

  /* Favorites + Settings + Map: fixed dark palette to match the Home deck */
  #v-fav, #v-settings, #v-map{
    --accent:#c084e8; --accent-ink:#fff; --accent-soft:#1b2030; --accent-soft-ink:#c4b5fd;
    --bg:#0f1118; --ink:#e8eaf2; --muted:#9aa0b5; --card:#171a27; --line:#262a3d;
    background:#0f1118; color:#e8eaf2;
  }
  .deckwrap{flex:1;display:flex;flex-direction:column;min-height:0}
  .deck{flex:1;display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;
    scroll-behavior:smooth;-webkit-overflow-scrolling:touch;min-height:0}
  .deck::-webkit-scrollbar{display:none}
  .dslide{flex:0 0 100%;width:100%;height:100%;scroll-snap-align:center;padding:2px 14px 10px;display:flex}
  .dcard{flex:1;display:flex;flex-direction:column;background:#171a27;border-radius:24px;overflow:hidden;
    box-shadow:0 14px 40px rgba(0,0,0,.45);border:1px solid #262a3d;min-height:0}
  .dhero{position:relative;height:46%;flex:none;display:flex;align-items:flex-end;padding:18px;color:#fff;
    background-size:cover;background-position:center}
  .dhero .dphoto{position:absolute;inset:0;background-size:cover;background-position:center;opacity:0;transition:opacity .4s}
  .dhero.hasphoto .dphoto{opacity:1}
  .dhero.hasphoto .demoji{display:none}
  .dhero .dcat{position:absolute;top:16px;left:16px;font-size:10px;font-weight:900;text-transform:uppercase;
    letter-spacing:.6px;background:rgba(0,0,0,.5);padding:6px 12px;border-radius:20px;backdrop-filter:blur(4px);z-index:3}
  .dhero .dfav{position:absolute;top:14px;right:14px;background:rgba(0,0,0,.5);border:0;color:#fff;font-size:20px;
    width:40px;height:40px;border-radius:50%;cursor:pointer;line-height:1;backdrop-filter:blur(4px);z-index:3}
  .dhero .dfav.on{color:#ffd84d}
  .dhero .dsrc{display:none;position:absolute;bottom:14px;right:14px;font-size:9px;font-weight:700;color:rgba(255,255,255,.85);
    background:rgba(0,0,0,.45);padding:3px 8px;border-radius:10px;z-index:3}
  .dhero.hasphoto .dsrc{display:block}
  .dhero .demoji{position:absolute;right:20px;top:44%;transform:translateY(-50%);font-size:70px;opacity:.9;z-index:1}
  .dhero h4{position:relative;margin:0;font-size:24px;font-weight:900;line-height:1.1;
    text-shadow:0 2px 14px rgba(0,0,0,.75);max-width:88%;z-index:3}
  .dhero::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.75),transparent 55%);z-index:2}
  .dbody{flex:1;overflow-y:auto;padding:16px 18px 20px;min-height:0}
  .dbody::-webkit-scrollbar{width:0}
  .dmeta{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:12px}
  .dmeta .t{font-size:11px;font-weight:800;padding:5px 10px;border-radius:8px;background:rgba(255,255,255,.07);color:#e8eaf2}
  .dmeta .t.free{background:#113b28;color:#4ade80}
  .dwhere{font-size:13px;color:#9aa0b5;margin-bottom:14px;line-height:1.4}
  .dwhere b{color:#e8eaf2;font-weight:700}
  .ddesc{font-size:14.5px;line-height:1.55;color:#cfd3e4}
  .ddesc .lbl{display:block;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.6px;color:#9aa0b5;margin-bottom:6px}
  .dnote{margin-top:14px;font-size:10.5px;line-height:1.4;color:#767c93;font-style:italic}
  .dacts{flex:none;display:flex;gap:8px;padding:12px 16px calc(14px + env(safe-area-inset-bottom));background:#171a27;border-top:1px solid #262a3d}
  .dacts a{flex:1;border:0;font-family:inherit;font-size:13px;font-weight:800;padding:13px 8px;border-radius:13px;
    text-align:center;text-decoration:none;cursor:pointer;white-space:nowrap}
  .dacts a.g{background:rgba(255,255,255,.08);color:#e8eaf2}
  .dacts a.p{background:#7b2d8e;color:#fff}
  .ddaylbl{flex:none;text-align:center;font-size:12px;font-weight:800;color:#9aa0b5;padding:2px 0 4px}
  .ddaylbl .today{color:#c084e8}

  /* Day group headers + loading */
  .daysep{display:flex;align-items:baseline;gap:8px;margin:22px 2px 2px;padding:0 2px}
  .daysep .d{font-size:16px;font-weight:900;color:var(--ink)}
  .daysep .d.today{color:var(--accent)}
  .daysep .n{font-size:11px;color:var(--muted);font-weight:600}
  .wkhdr{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.6px;color:var(--accent);
    margin:22px 2px 0;padding:0 2px;display:flex;align-items:center;gap:8px}
  .wkhdr .ln{flex:1;height:1.5px;background:var(--line)}
  .bar{height:4px;background:var(--accent-soft);border-radius:4px;overflow:hidden;margin:8px 18px}
  .bar>i{display:block;height:100%;width:0;background:var(--accent);transition:width .3s}
  .statusmsg{font-size:12px;color:var(--muted);text-align:center;padding:2px 18px;min-height:16px}
  .skel{background:var(--card);border-radius:20px;box-shadow:0 8px 24px rgba(0,0,0,.1);overflow:hidden}
  .skel .sh{height:116px;background:linear-gradient(90deg,var(--accent-soft),var(--line),var(--accent-soft));
    background-size:200% 100%;animation:sh 1.2s infinite}
  .skel .sb{padding:14px}
  .skel .sb .ln{height:11px;border-radius:6px;margin:7px 0;background:linear-gradient(90deg,var(--accent-soft),var(--line),var(--accent-soft));background-size:200% 100%;animation:sh 1.2s infinite}
  @keyframes sh{0%{background-position:200% 0}100%{background-position:-200% 0}}
  details.standing{margin:22px 2px 0}
  details.standing summary{cursor:pointer;font-weight:800;color:var(--accent);font-size:14px;list-style:none;
    padding:12px 14px;background:var(--card);border-radius:14px;box-shadow:0 4px 14px rgba(0,0,0,.08)}
  details.standing summary::-webkit-details-marker{display:none}
  details.standing .feed{margin-top:12px;padding:0}

  /* ===== Bottom nav (fixed dark, matching the deck prototype) ===== */
  .nav{position:absolute;left:0;right:0;bottom:0;height:64px;background:#171a27;border-top:1px solid #262a3d;
    display:flex;z-index:50;padding-bottom:env(safe-area-inset-bottom)}
  .nav button{flex:1;background:none;border:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:3px;font-size:10px;font-weight:700;color:#9aa0b5;cursor:pointer;font-family:inherit;position:relative}
  .nav button .ic{font-size:21px;line-height:1;opacity:.6;transition:.15s}
  .nav button.on{color:#c084e8}
  .nav button.on .ic{opacity:1;transform:translateY(-1px)}
  .nav button .badge{position:absolute;top:7px;right:calc(50% - 20px);background:#ff3b6b;color:#fff;font-size:8px;font-weight:800;padding:1px 5px;border-radius:10px}
</style>
</head>
<body>
<div id="app"></div>

<script>
/* =========================================================================
   FASE 2 — motor real injertado. Búsqueda vía /api/search (api-shim +
   engine.js), resultados reales como tiles Magazine agrupados por día.
   Favoritos persistentes en localStorage. Mapa Leaflet y cercanía: Fase 3-4.
   ========================================================================= */

const THEMES = [
  ["magazine","Original","linear-gradient(135deg,#f857a6,#ff5858)"],
  ["grape","Uva","linear-gradient(135deg,#9b3fb0,#7b2d8e)"],
  ["ocean","Océano","linear-gradient(135deg,#06b6d4,#2563eb)"],
  ["sunset","Atardecer","linear-gradient(135deg,#fb7185,#f97316)"],
  ["forest","Bosque","linear-gradient(135deg,#34d399,#059669)"],
  ["candy","Chuche","linear-gradient(135deg,#f472b6,#a855f7)"],
  ["dark","Oscuro","linear-gradient(135deg,#7c5cff,#4fd1c5)"],
];

// Category -> emoji for the tile hero.
const CAT_EMOJI = {
  "CuentacuentosTiteresMarionetas":"🧸","TeatroPerformance":"🎭","CircoMagia":"🎪",
  "CursosTalleres":"🎨","Musica":"🎵","DanzaBaile":"💃","CineActividadesAudiovisuales":"🎬",
  "ExcursionesItinerariosVisitas":"🧭","ClubesLectura":"📚","ActividadesCalleArteUrbano":"🖌️","Fiestas":"🎉"
};
function catEmoji(a){ return CAT_EMOJI[a.category] || "🎈"; }

// Category chips (key + short label) shown on Home for quick filtering.
const CATS = [
  ["CuentacuentosTiteresMarionetas","🧸 Cuentos"],
  ["TeatroPerformance","🎭 Teatro"],
  ["CircoMagia","🎪 Circo"],
  ["CursosTalleres","🎨 Talleres"],
  ["Musica","🎵 Música"],
  ["DanzaBaile","💃 Danza"],
  ["CineActividadesAudiovisuales","🎬 Cine"],
  ["ExcursionesItinerariosVisitas","🧭 Visitas"],
  ["ClubesLectura","📚 Lectura"],
  ["ActividadesCalleArteUrbano","🖌️ Calle"],
  ["Fiestas","🎉 Fiestas"],
];
const selCats = new Set();      // selected category keys
let freeOnlyQuick = false;      // "Gratis" quick chip
let weekendOnly = false;        // "Finde" quick chip (client-side filter)

// ---- state ----
let lastResult = null;         // raw result from the engine
let currentView = "home";
const FAV_KEY = "mk_favs";
let FAVS = new Map();   // id -> full activity object (so favs show even outside current search)
try {
  const raw = JSON.parse(localStorage.getItem(FAV_KEY)||"[]");
  if(Array.isArray(raw)){
    // migrate: old format was an array of ids (strings). New format: array of activity objects.
    raw.forEach(x=>{
      if(x && typeof x==="object"){ FAVS.set(favId(x), x); }
    });
  }
} catch(e){}
function favId(a){ return (a && (a.id || (a.title+"|"+((a.dates&&a.dates[0])||"")))) || ""; }
function isFav(id){ return FAVS.has(id); }
function saveFavs(){
  try{ localStorage.setItem(FAV_KEY, JSON.stringify([...FAVS.values()])); }catch(e){}
  updateBadge();
}
// Toggle a favorite given the full activity object.
function toggleFavObj(a){
  const id=favId(a);
  if(FAVS.has(id)) FAVS.delete(id); else FAVS.set(id, a);
  saveFavs();
  return FAVS.has(id);
}

// ---- theme ----
function getTheme(){ return document.documentElement.getAttribute("data-apptheme") || "magazine"; }
function setTheme(id){
  document.documentElement.setAttribute("data-apptheme", id);
  try{ localStorage.setItem("mk_colorTheme", id); }catch(e){}
  const meta=document.querySelector('meta[name="theme-color"]');
  if(meta){ meta.setAttribute("content", id==="dark"?"#0f1118":"#ffffff"); }
}

// ---- date helpers (ported from the original app) ----
const DOW=["lunes","martes","miércoles","jueves","viernes","sábado","domingo"];
const MON=["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];
function todayISO(){ return new Date().toISOString().slice(0,10); }
function tomorrowISO(){ const d=new Date(); d.setDate(d.getDate()+1); return d.toISOString().slice(0,10); }
function dObj(iso){ return new Date(iso+"T00:00:00"); }
function dayLabel(iso){
  if(iso===todayISO()) return "Hoy";
  if(iso===tomorrowISO()) return "Mañana";
  const d=dObj(iso);
  return `${DOW[(d.getDay()+6)%7].replace(/^./,c=>c.toUpperCase())} ${d.getDate()} ${MON[d.getMonth()]}`;
}
function esc(s){ return (s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function prettyDist(s){ return (s||"").replace(/([a-z])([A-Z])/g,"$1 $2").replace(/-/g," ").replace(/\b\w/g,c=>c.toUpperCase()); }
// Separate a glued CamelCase category label (e.g. "ExcursionesItinerariosVisitas")
// into words, so the card badge never shows one long run-on string.
function prettyCat(s){ return (s||"Actividad").replace(/([a-z\u00e0-\u00ff])([A-Z])/g,"$1 $2").trim(); }
// Short, single-word category labels, with a few variants per category so the
// badge varies across cards (chosen deterministically by the activity id).
const CAT_LABELS = {
  "CuentacuentosTiteresMarionetas":["Cuentacuentos","Títeres","Marionetas"],
  "TeatroPerformance":["Teatro"],
  "CursosTalleres":["Talleres","Taller"],
  "CircoMagia":["Circo","Magia"],
  "CineActividadesAudiovisuales":["Cine"],
  "Musica":["Música"],
  "DanzaBaile":["Danza","Baile"],
  "ExcursionesItinerariosVisitas":["Visitas","Itinerarios","Excursiones"],
  "ClubesLectura":["Lectura","Club de lectura"],
  "ActividadesCalleArteUrbano":["Arte urbano","Calle"],
  "Fiestas":["Fiestas","Fiesta"]
};
function catLabel(a){
  const list = CAT_LABELS[a && a.category];
  if(list && list.length){ return list[hashIdx(favId(a), list.length)]; }
  return prettyCat(a && a.category_label);
}
function ageText(a){
  if(!a.age_known) return "Todas las edades";
  const [lo,hi]=a.age_range||[];
  if(lo!=null&&hi!=null) return lo===hi?`${lo} años`:`${lo}–${hi} años`;
  if(lo!=null) return `desde ${lo}`;
  if(hi!=null) return `hasta ${hi}`;
  return "Todas las edades";
}
function dirLink(a){
  if(a.lat&&a.lon) return `https://www.google.com/maps/dir/?api=1&destination=${a.lat},${a.lon}`;
  const q=encodeURIComponent([a.venue,a.address,"Madrid"].filter(Boolean).join(", "));
  return `https://www.google.com/maps/dir/?api=1&destination=${q}`;
}
async function shareActivity(a){
  const text=`${a.title}${a.time?` · ${a.time}`:""}${a.venue?`\n${a.venue}`:""}`;
  try{
    if(navigator.share) await navigator.share({title:a.title,text,url:a.link||location.href});
    else if(navigator.clipboard) await navigator.clipboard.writeText(text+(a.link?`\n${a.link}`:""));
  }catch(_){}
}

// Find an activity by its favId: prefer the current result, fall back to saved favs.
function actById(id){
  if(lastResult){
    const hit=lastResult.activities.find(a=>favId(a)===id);
    if(hit) return hit;
  }
  return FAVS.get(id) || null;
}

// ---- image resolution for the deck hero (priority: Ayto. ficha -> Openverse -> gradient) ----
// Only the final URL is cached (per activity id) in localStorage; bytes are not stored.
const IMG_CACHE_KEY = "mk_imgCache_v3";
let IMG_CACHE = {};
try { IMG_CACHE = JSON.parse(localStorage.getItem(IMG_CACHE_KEY) || "{}") || {}; } catch(_) { IMG_CACHE = {}; }
function saveImgCache(){ try{ localStorage.setItem(IMG_CACHE_KEY, JSON.stringify(IMG_CACHE)); }catch(_){} }

// Native HTTP (Capacitor) is required to read the madrid.es ficha (Akamai blocks
// plain fetch/CORS). On the plain web PWA this step is skipped automatically.
function nativeHttpGet(url){
  const Cap = window.Capacitor, Http = Cap && Cap.Plugins && Cap.Plugins.CapacitorHttp;
  if(!Http) return Promise.resolve(null);
  return Http.get({ url, headers:{ "User-Agent":"Mozilla/5.0", Accept:"text/html" }, responseType:"text" })
    .then(r => typeof r.data === "string" ? r.data : null).catch(()=>null);
}
// Parse the activity ficha HTML for the official poster image.
function parseFichaImage(html){
  if(!html) return null;
  // Collect every <img src="..."> and pick the real poster, skipping chrome/logos.
  const srcs = [];
  const re = /<img[^>]+src="([^"]+)"/gi;
  let m;
  while((m = re.exec(html))){ srcs.push(m[1]); }
  const isJunk = (s) => {
    const low = s.toLowerCase();
    return low.indexOf("data:") === 0 ||
           low.indexOf("/assets/") !== -1 ||
           low.indexOf("logo") !== -1 ||
           low.indexOf("infovisitas") !== -1 ||
           low.indexOf("/secciones/") !== -1 ||       // generic site banners
           low.indexOf("actualidad_") !== -1 ||
           low.indexOf("stage-ranking") !== -1 ||
           low.indexOf(".svg") !== -1 ||
           low.indexOf("spacer") !== -1 || low.indexOf("blank") !== -1;
  };
  // Preferred: the folders where activity posters actually live.
  const prefer = (s) => {
    const low = s.toLowerCase();
    return low.indexOf("/unidadesdescentralizadas/") !== -1 ||
           low.indexOf("/unidadweb/ugbbdd/") !== -1 ||
           low.indexOf("/ficheros/") !== -1;
  };
  let pick = srcs.find(s => !isJunk(s) && prefer(s));
  // Fallback: inside the known content containers (older ficha layout).
  if(!pick){
    const mm = html.match(/<div class="image-content[^"]*">[\s\S]*?<img[^>]+src="([^"]+)"/i)
            || html.match(/<div class="tramites-content">[\s\S]*?<img[^>]+src="([^"]+)"/i);
    if(mm && !isJunk(mm[1])) pick = mm[1];
  }
  if(!pick) return null;
  let src = pick.replace(/&amp;/g, "&");
  if(src.indexOf("//") === 0) src = "https:" + src;
  else if(src.charAt(0) === "/") src = "https://www.madrid.es" + src;
  return src;
}
// Openverse keyword fallback (free, no key, works in browser + native).
// Keywords chosen by voting on real Openverse results (best-looking, kid-friendly).
// Where several candidates scored well, a 2nd keyword adds variety across cards.
const CAT_QUERY = {
  "CuentacuentosTiteresMarionetas":["teatro titeres infantil","cuentacuentos biblioteca","puppet show colorful"],
  "TeatroPerformance":["obra infantil escenario","titeres escenario niños"],
  "CircoMagia":["payaso circo colores","acrobata circo"],
  "CursosTalleres":["manualidades niños pintura","children craft colorful"],
  "Musica":["coro infantil"],
  "DanzaBaile":["danza infantil","baile tradicional niños"],
  "CineActividadesAudiovisuales":["cine infantil"],
  "ExcursionesItinerariosVisitas":["museo sala exposicion","niños visita museo"],
  "ClubesLectura":["biblioteca infantil libros"],
  "ActividadesCalleArteUrbano":["colorful street mural","mural infantil colores"],
  "Fiestas":["kids carnival colorful"]
};
// Reject obviously wrong / creepy / adult / dull results by title+tags.
const IMG_BAD = /\b(horror|scary|death|dead|grave|cemetery|funeral|blood|war|weapon|gun|nude|naked|erotic|sexy|lingerie|bed|bedroom|hospital|sick|cry|sad|dark|ghost|skull|zombie|protest|smoke|cigarette|alcohol|drug)\b/i;
// Prefer real color photos from decent providers.
const IMG_GOOD_SRC = { flickr:1, wikimedia:1, rawpixel:1, stocksnap:1, nappy:1 };
// Deterministic index from an activity id, so each card keeps a stable pick.
function hashIdx(id, n){
  let h = 0; const s = String(id);
  for(let i=0;i<s.length;i++){ h = (h*31 + s.charCodeAt(i))|0; }
  return n>0 ? (Math.abs(h) % n) : 0;
}
// In-memory cache: one Openverse search per keyword (not per card). Cards in
// the same category reuse the pool and just pick a different photo by hash.
const OV_POOL = {};            // query -> Promise<array of image urls>
function fetchOvPool(q){
  if(OV_POOL[q]) return OV_POOL[q];
  const url = "https://api.openverse.org/v1/images/?q="+encodeURIComponent(q)
    + "&page_size=8&mature=false&category=photograph&aspect_ratio=wide";
  OV_POOL[q] = fetch(url, { headers:{ Accept:"application/json" } })
    .then(r => r.ok ? r.json() : {results:[]})
    .then(j => {
      let hits = (j.results||[]).filter(h => {
        if(!(h.thumbnail || h.url)) return false;
        const txt = (h.title||"") + " " + ((h.tags||[]).map(t=>t.name||t).join(" "));
        return !IMG_BAD.test(txt);
      });
      const good = hits.filter(h => IMG_GOOD_SRC[(h.source||"").toLowerCase()]);
      const pool = (good.length ? good : hits);
      return pool.map(h => h.thumbnail || h.url).filter(Boolean);
    })
    .catch(() => []);
  return OV_POOL[q];
}
async function openverseImage(a){
  const list = CAT_QUERY[a.category] || ["children activity colorful"];
  const q = list[hashIdx(favId(a), list.length)];
  const pool = await fetchOvPool(q);
  if(!pool.length) return null;
  // Deterministic pick keyed on the activity id -> stable, varied across cards.
  return pool[hashIdx(favId(a)+"|img", pool.length)];
}
// Resolve + apply the hero image for one card element. Non-blocking; card shows
// the gradient+emoji immediately and upgrades in place when an image arrives.
async function applyHeroImage(a, heroEl){
  if(!heroEl) return;
  const id = favId(a);
  const show = (url, official) => {
    if(!url || !heroEl.isConnected) return;
    const im = new Image();
    im.onload = () => {
      if(!heroEl.isConnected) return;
      const ph = heroEl.querySelector(".dphoto, .photo"); if(ph) ph.style.backgroundImage = `url("${url}")`;
      heroEl.classList.add("hasphoto");
      const src = heroEl.querySelector(".dsrc"); if(src) src.textContent = official ? "📷 madrid.es" : "📷 imagen orientativa";
    };
    im.src = url;
  };
  // 0) official poster resolved by the backend (works on web + APK). Highest
  //    priority: it is the real madrid.es image, so it wins over any older
  //    keyword fallback that may be cached from a previous version.
  if(a.image){
    IMG_CACHE[id]={url:a.image,official:true}; saveImgCache();
    show(a.image, true); return;
  }
  // 1) cached result (re-validate non-official picks against the blocklist)
  const cached = IMG_CACHE[id];
  if(cached && cached.url){
    if(cached.official || !IMG_BAD.test(cached.url)){ show(cached.url, cached.official); return; }
    delete IMG_CACHE[id]; saveImgCache(); // bad cached pick -> drop and re-resolve
  } else if(cached && cached.none){ return; } // known: no image, keep gradient

  // 2) official ficha image (native/APK only; web is covered by step 0)
  if(a.link){
    const html = await nativeHttpGet(a.link);
    const ficha = parseFichaImage(html);
    if(ficha){ IMG_CACHE[id]={url:ficha,official:true}; saveImgCache(); show(ficha,true); return; }
  }
  // 3) Openverse keyword fallback
  const ov = await openverseImage(a);
  if(ov){ IMG_CACHE[id]={url:ov,official:false}; saveImgCache(); show(ov,false); return; }
  // 4) nothing -> remember, keep gradient+emoji
  IMG_CACHE[id]={none:true}; saveImgCache();
}

// ---- full-screen deck card for one activity ----
let deckHeroSeq = 0;
function deckCardHTML(a, dayLbl){
  const hc = (deckHeroSeq++ % 5) + 1;
  const id = favId(a);
  const fav = isFav(id);
  const price = a.free ? `<span class="t free">Gratis</span>`
    : `<span class="t">${a.price?esc(a.price.slice(0,22)):'De pago'}</span>`;
  const dist = a.district ? ` · ${esc(prettyDist(a.district))}` : "";
  const desc = a.description ? esc(a.description) : "";
  const detBtn = a.link
    ? `<a class="p" href="${esc(a.link)}" target="_blank" rel="noopener">Ver detalles</a>`
    : `<a class="p" data-share="${esc(id)}">🔗 Compartir</a>`;
  return `<div class="dslide">
    <div class="dcard">
      ${dayLbl?`<div class="ddaylbl">${dayLbl}</div>`:""}
      <div class="dhero hc${hc}" data-img="${esc(id)}" style="background:linear-gradient(135deg,var(--hero1),var(--hero2))">
        <div class="dphoto"></div>
        <span class="dcat">${esc(catLabel(a))}</span>
        <button class="dfav ${fav?'on':''}" data-fav="${esc(id)}" title="Favorito">${fav?'★':'☆'}</button>
        <span class="demoji">${catEmoji(a)}</span>
        <span class="dsrc"></span>
        <h4>${esc(a.title)}</h4>
      </div>
      <div class="dbody">
        <div class="dmeta">${a.time?`<span class="t">🕐 ${esc(a.time)}</span>`:""}${price}<span class="t">${esc(ageText(a))}</span></div>
        <div class="dwhere">📍 <b>${esc(a.venue||"")}</b>${dist}${a.address?`<br>${esc(a.address)}`:""}</div>
        ${desc?`<div class="ddesc"><span class="lbl">Sobre la actividad</span>${desc}</div>`:""}
        ${a.image?"":`<div class="dnote">📷 Imagen orientativa; puede no corresponder a la actividad real.</div>`}
      </div>
      <div class="dacts">
        <a class="g" href="${dirLink(a)}" target="_blank" rel="noopener">🧭 Cómo llegar</a>
        ${a.link?`<a class="g" data-share="${esc(id)}">🔗 Compartir</a>`:""}
        ${detBtn}
      </div>
    </div></div>`;
}

// ---- Home deck: linear order by day across week windows ----
function renderHome(){
  const home=document.getElementById("v-home");
  const host=document.getElementById("v-home-feed");
  if(!host) return;
  if(!lastResult){ host.innerHTML=""; return; }
  deckHeroSeq=0;
  let acts=lastResult.activities.slice();
  // Client-side filters: district + weekend (unchanged behavior).
  const distSel=(document.getElementById("district")||{}).value||"";
  if(distSel) acts=acts.filter(a=>a.district===distSel);
  const isWeekend=(iso)=>{ const wd=dObj(iso).getDay(); return wd===0||wd===6; };
  if(weekendOnly){
    acts=acts.map(a=>{ const wd=a.dates.filter(isWeekend); return wd.length?{...a,dates:wd}:null; }).filter(Boolean);
  }
  const dated=acts.filter(a=>!a.standing);
  const standing=acts.filter(a=>a.standing);

  // Build a flat, chronological list of {activity, dayLabel} cards.
  const cards=[];
  (lastResult.weeks||[]).forEach(w=>{
    const dayMap={};
    dated.forEach(a=>a.dates.forEach(d=>{ if(d>=w.start&&d<=w.end){ (dayMap[d]=dayMap[d]||[]).push(a); } }));
    Object.keys(dayMap).sort().forEach(day=>{
      const list=dayMap[day].slice().sort((x,y)=>(y.score||0)-(x.score||0));
      const today=day===todayISO();
      const lbl=`${today?'⭐ ':''}<span class="${today?'today':''}">${esc(dayLabel(day))}</span>`;
      list.forEach(a=>cards.push({a,lbl}));
    });
  });
  standing.forEach(a=>cards.push({a,lbl:'<span>Programa permanente</span>'}));

  if(!cards.length){
    home.classList.remove("deckmode");
    const oldc=home.querySelector(".top #dcount"); if(oldc) oldc.remove();
    host.innerHTML=`<div class="empty"><div class="big">🔍</div>No hay actividades para estos filtros.<br>Prueba a ampliar el periodo o quitar filtros.</div>`;
    return;
  }

  home.classList.add("deckmode");
  const slides=cards.map(c=>deckCardHTML(c.a,c.lbl)).join("");
  host.innerHTML=`<div class="deckwrap"><div class="deck" id="deck">${slides}</div></div>`;
  // counter in the header top-right (prototype style)
  const topEl=home.querySelector(".top");
  if(topEl){
    let c=topEl.querySelector("#dcount");
    if(!c){ c=document.createElement("div"); c.id="dcount"; c.className="dcount"; topEl.appendChild(c); }
    c.innerHTML=`<b>1</b> / ${cards.length}`;
  }
  wireDeck(host, cards.length);
  // Warm the per-keyword image pools in parallel so later cards resolve
  // instantly. Only distinct keywords actually present in this result set.
  prefetchImagePools(cards.map(c=>c.a));
}

// Kick off (and cache) the Openverse search for every distinct keyword used by
// the given activities, so hero images are ready before the card is swiped to.
function prefetchImagePools(acts){
  const seen = {};
  for(const a of acts){
    const list = CAT_QUERY[a.category]; if(!list) continue;
    for(const q of list){ if(!seen[q]){ seen[q]=1; fetchOvPool(q); } }
  }
}

function wireDeck(host, total, countEl){
  // Favorite + share
  host.querySelectorAll(".dfav").forEach(s=> s.onclick=()=>{
    const id=s.dataset.fav; const a=actById(id);
    if(a){ const now=toggleFavObj(a); s.classList.toggle("on",now); s.textContent=now?"★":"☆";
      // In the Favorites view, drop a card as soon as it is unfavorited.
      if(!now && host.id==="v-fav"){ renderFavs(); }
    }
  });
  host.querySelectorAll("[data-share]").forEach(b=> b.onclick=(e)=>{
    e.preventDefault(); const a=actById(b.dataset.share); if(a) shareActivity(a);
  });
  // Active-slide tracking (counter in header)
  const deck=host.querySelector(".deck");
  if(countEl===undefined) countEl=document.querySelector("#v-home .top #dcount");
  let idx=0;
  if(deck){
    deck.addEventListener("scroll",()=>{
      const i=Math.round(deck.scrollLeft/deck.clientWidth);
      if(i!==idx){ idx=i;
        if(countEl) countEl.innerHTML=`<b>${i+1}</b> / ${total}`;
        lazyImages(deck, i);
      }
    }, {passive:true});
  }
  // Resolve images lazily around the first card.
  lazyImages(deck, 0);
}
// Resolve hero images for the visible card and its neighbours only.
function lazyImages(deck, center){
  if(!deck) return;
  const slides=deck.querySelectorAll(".dslide");
  // Preload a wider window around the current card. Resolutions run in
  // parallel (applyHeroImage is async and not awaited) and share the
  // per-keyword Openverse cache, so this stays cheap.
  const R=3;
  for(let j=Math.max(0,center-R); j<=center+R && j<slides.length; j++){
    const hero=slides[j].querySelector(".dhero");
    if(hero && !hero.dataset.resolved){
      hero.dataset.resolved="1";
      const id=hero.dataset.img;
      const a=actById(id);
      if(a) applyHeroImage(a, hero);
    }
  }
}

// ---- compact vertical tile (used by Favorites list) ----
let heroSeq = 0;
function tileHTML(a){
  const hc = (heroSeq++ % 5) + 1;
  const id = favId(a);
  const fav = isFav(id);
  const price = a.free ? `<span class="t free">gratis</span>`
    : `<span class="t">${a.price?esc(a.price.slice(0,18)):'de pago'}</span>`;
  const dist = a.district ? ` · ${esc(prettyDist(a.district))}` : "";
  return `<div class="tile">
    <div class="hero hc${hc}" data-img="${esc(id)}">
      <div class="photo"></div>
      <span class="cat">${esc(catLabel(a))}</span>
      <span class="emoji">${catEmoji(a)}</span>
      <span class="dsrc tsrc"></span>
      <h4>${esc(a.title)}</h4>

// ---- Map view (real Leaflet) ----
let _map=null, _markers=[], _leafletP=null, _mapById={};
let userPos=null;        // {lat,lon} once the user shares location
let userMarker=null;
function haversineKm(aLat,aLon,bLat,bLon){
  const R=6371, toR=x=>x*Math.PI/180;
  const dLa=toR(bLat-aLat), dLo=toR(bLon-aLon);
  const s=Math.sin(dLa/2)**2+Math.cos(toR(aLat))*Math.cos(toR(bLat))*Math.sin(dLo/2)**2;
  return 2*R*Math.asin(Math.sqrt(s));
}
// Resolve location via Capacitor (native) when packaged, else the browser API.
function getPosition(){
  const Cap=window.Capacitor, Geo=Cap&&Cap.Plugins&&Cap.Plugins.Geolocation;
  if(Geo){
    return (async()=>{
      try{ await Geo.requestPermissions(); }catch(_){}
      const pos=await Geo.getCurrentPosition({enableHighAccuracy:false,timeout:10000,maximumAge:300000});
      return {lat:pos.coords.latitude, lon:pos.coords.longitude};
    })();
  }
  return new Promise((resolve,reject)=>{
    if(!navigator.geolocation){ const e=new Error("no gps"); e.code=2; return reject(e); }
    navigator.geolocation.getCurrentPosition(
      p=>resolve({lat:p.coords.latitude,lon:p.coords.longitude}),
      e=>reject(e), {enableHighAccuracy:false,timeout:10000,maximumAge:300000});
  });
}
function loadLeaflet(){
  if(window.L) return Promise.resolve();
  if(_leafletP) return _leafletP;
  _leafletP=new Promise((resolve,reject)=>{
    const css=document.createElement("link");
    css.rel="stylesheet"; css.href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css";
    css.integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="; css.crossOrigin="";
    document.head.appendChild(css);
    const js=document.createElement("script");
    js.src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js";
    js.integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="; js.crossOrigin="";
    js.onload=()=>resolve(); js.onerror=()=>reject(new Error("No se pudo cargar el mapa"));
    document.head.appendChild(js);
  });
  return _leafletP;
}
function ensureMap(){
  if(_map) return;
  _map=L.map("map",{scrollWheelZoom:false}).setView([40.4168,-3.7038],12);
  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:"© OpenStreetMap"}).addTo(_map);
}
function clearMarkers(){ if(_map) _markers.forEach(m=>_map.removeLayer(m)); _markers=[]; _mapById={}; }
async function renderMapPins(){
  const host=document.getElementById("v-map");
  if(!lastResult) return;
  try{
    await loadLeaflet();
  }catch(e){
    const ml=document.getElementById("maploading"); if(ml) ml.textContent="No se pudo cargar el mapa.";
    return;
  }
  const ml=document.getElementById("maploading"); if(ml) ml.remove();
  ensureMap();
  clearMarkers();
  const withGeo=lastResult.activities.filter(a=>a.lat&&a.lon);
  withGeo.forEach(a=>{
    const id=favId(a);
    const m=L.marker([a.lat,a.lon]).addTo(_map);
    m.on("click",()=>{ showPopup(id); });
    _markers.push(m); _mapById[id]=m;
  });
  // Fit to markers.
  if(_markers.length){
    const b=_markers.map(m=>m.getLatLng());
    _map.fitBounds(b,{padding:[40,40],maxZoom:14});
  }
  // Make sure Leaflet lays out correctly after the view becomes visible.
  setTimeout(()=>{ if(_map) _map.invalidateSize(); },60);
  // Open the first activity in the bottom card.
  if(withGeo.length) showPopup(favId(withGeo[0]));
  else { const mc=document.getElementById("mapcard"); if(mc) mc.innerHTML=""; }
}
function showPopup(id){
  const mc=document.getElementById("mapcard"); if(!mc) return;
  const a=actById(id); if(!a){ mc.innerHTML=""; return; }
  const fav=isFav(id);
  const dkm = (userPos && a.lat && a.lon) ? haversineKm(userPos.lat,userPos.lon,a.lat,a.lon) : null;
  const distTxt = dkm!=null ? (dkm<1?`${Math.round(dkm*1000)} m`:`${dkm.toFixed(1)} km`) : "";
  mc.innerHTML=`<div class="head"><span class="em">${catEmoji(a)}</span>
    <div class="mc"><h4>${esc(a.title)}</h4><div class="mm">${a.time?`🕐 ${esc(a.time)} · `:""}📍 ${esc(a.venue||"")}${distTxt?` · 📏 ${distTxt}`:""}</div></div>
    <button class="fav ${fav?'on':''}" data-fav="${esc(id)}">${fav?'★':'☆'}</button>
    <button class="close">✕</button></div>
    <div class="r"><span class="t">${esc(catLabel(a))}</span>
      <span class="t ${a.free?'free':''}">${a.free?'gratis':'de pago'}</span><span class="t">${esc(ageText(a))}</span></div>
    <div class="btns">
      <a class="g" data-share="1">🔗 Compartir</a>
      <a class="g" href="${dirLink(a)}" target="_blank" rel="noopener">🧭 Cómo llegar</a>
      ${a.link?`<a class="p" href="${esc(a.link)}" target="_blank" rel="noopener">Ver detalles</a>`:""}</div>`;
  mc.querySelector("[data-share]")?.addEventListener("click",(e)=>{e.preventDefault();shareActivity(a);});
  // Pan the map to the chosen marker.
  const mk=_mapById[id];
  if(_map && mk){ _map.panTo(mk.getLatLng()); }
}

// ---- search (streaming via api-shim) ----
function showSkeleton(){
  const host=document.getElementById("v-home-feed"); if(!host) return;
  let s=""; for(let i=0;i<4;i++) s+=`<div class="skel" style="margin:14px 18px"><div class="sh"></div>
    <div class="sb"><div class="ln" style="width:70%"></div><div class="ln" style="width:45%"></div><div class="ln" style="width:90%"></div></div></div>`;
  host.innerHTML=s;
}
function populateDistricts(acts){
  const sel=document.getElementById("district"); if(!sel) return;
  const cur=sel.value;
  const set=new Set(acts.map(a=>a.district).filter(Boolean));
  const sorted=[...set].sort((a,b)=>prettyDist(a).localeCompare(prettyDist(b)));
  sel.innerHTML=`<option value="">Todos los distritos</option>`+sorted.map(d=>`<option value="${esc(d)}">${esc(prettyDist(d))}</option>`).join("");
  if(set.has(cur)) sel.value=cur;
}
async function runSearch(){
  const go=document.getElementById("go");
  const bar=document.getElementById("bar");
  const statusEl=document.getElementById("status");
  if(go) go.disabled=true;
  showView("home");
  showSkeleton();
  if(bar) bar.style.width="8%";
  if(statusEl) statusEl.textContent="Buscando…";
  const job={
    age: parseInt((document.getElementById("age")||{}).value||"3",10),
    weeks: parseInt((document.getElementById("weeks")||{}).value||"3",10),
    categories: [...selCats],
    free_only: freeOnlyQuick || !!(document.getElementById("free_only")||{}).checked,
    strict_age: !!(document.getElementById("strict_age")||{}).checked,
    query: ((document.getElementById("query")||{}).value||"").trim(),
  };
  try{ localStorage.setItem("mk_lastSearch", JSON.stringify(job)); }catch(_){}
  try{
    const resp=await fetch("/api/search",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(job)});
    const reader=resp.body.getReader(); const dec=new TextDecoder(); let buf="",pct=8;
    while(true){
      const {done,value}=await reader.read(); if(done) break;
      buf+=dec.decode(value,{stream:true}); let idx;
      while((idx=buf.indexOf("\n"))>=0){
        const line=buf.slice(0,idx); buf=buf.slice(idx+1);
        if(!line.trim()) continue;
        let msg; try{ msg=JSON.parse(line); }catch(_){ continue; }
        if(msg.type==="progress"){ if(statusEl) statusEl.textContent=msg.data.msg||""; pct=Math.min(90,pct+18); if(bar) bar.style.width=pct+"%"; }
        else if(msg.type==="result"){ if(bar) bar.style.width="100%"; lastResult=msg.data; populateDistricts(msg.data.activities); if(statusEl) statusEl.textContent=""; renderHome(); updateBadge(); }
        else if(msg.type==="error"){ if(statusEl) statusEl.textContent="Error: "+msg.data; }
      }
    }
  }catch(err){
    if(statusEl) statusEl.textContent="Error de conexión: "+(err&&err.message||err);
  }finally{
    if(go) go.disabled=false;
    setTimeout(()=>{ if(bar) bar.style.width="0"; },700);
  }
}

// ---- boot ----
(function restore(){
  let saved; try{ saved=JSON.parse(localStorage.getItem("mk_lastSearch")||"null"); }catch(_){ saved=null; }
  render();
  // apply saved search fields then auto-run
  if(saved){
    const set=(id,v)=>{ const el=document.getElementById(id); if(el!=null&&v!=null) el.value=v; };
    set("age",saved.age); set("weeks",String(saved.weeks)); set("query",saved.query||"");
    const fo=document.getElementById("free_only"); if(fo) fo.checked=!!saved.free_only;
    const sa=document.getElementById("strict_age"); if(sa) sa.checked=!!saved.strict_age;
  }
  requestAnimationFrame(runSearch);
})();

let deferredPrompt=null;

function showInstallChip(){

  const c=document.createElement("button");

  c.style.cssText="position:fixed;left:50%;transform:translateX(-50%);bottom:76px;z-index:600;"+
    "background:var(--accent);color:var(--accent-ink);border:0;border-radius:24px;padding:11px 18px;"+
    "font-size:13px;font-weight:800;box-shadow:0 6px 18px rgba(0,0,0,.3);cursor:pointer;font-family:inherit";
  c.onclick=async()=>{
    if(!deferredPrompt) return;
    deferredPrompt.prompt();
    try{ await deferredPrompt.userChoice; }catch(_){}
    deferredPrompt=null; c.remove();
  };
  document.body.appendChild(c);
}
